name: 构建相册动态壁纸 APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: 给gradlew权限
        run: chmod +x gradlew
      - name: 编译Release包
        run: ./gradlew assembleRelease
      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: wallpaper-apk
          path: app/build/outputs/apk/release/*.apk
